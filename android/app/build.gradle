apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// def enableProguardInReleaseBuilds = false
def enableProguardInReleaseBuilds = true
def enableSeparateBuildPerCPUArchitecture = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "in.webgrid.svindobusiness"
    defaultConfig {
        applicationId "in.webgrid.svindobusiness"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "1.0.2"
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            exclude 'x86', 'x86_64'
            universalApk false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release-key.keystore')
            storePassword 'svindo123'
            keyAlias 'svindo-key'
            keyPassword 'svindo123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            excludes += [
                '**/lib/x86_64/libbarhopper_v3.so',
                '**/lib/x86_64/libreactnativemmkv.so',
                '**/lib/x86/libbarhopper_v3.so',
                '**/lib/x86/libreactnativemmkv.so'
            ]
        }
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-vector-icons')
    
    // Google ML Kit Barcode Scanning (updated for 16KB page size support)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.0.2'

    implementation(project(':react-native-maps')){
      exclude group: 'com.google.android.gms'
    }
  
    // Force AndroidX core library
    implementation 'androidx.core:core:1.16.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.16.0'
        force 'androidx.core:core-ktx:1.16.0'
        force 'androidx.media3:media3-ui:1.4.1'
        force 'androidx.media3:media3-session:1.4.1'
    }
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.android.support', module: 'support-media-compat'
    exclude group: 'com.android.support', module: 'support-fragment'
}


apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Fix for duplicate Glide classes between react-native-blasted-image 
afterEvaluate {
    // Remove duplicates before DEX merging
    tasks.matching { it.name == 'mergeLibDexDebug' || it.name == 'mergeLibDexRelease' }.configureEach { task ->
        task.doFirst {
            // Find and remove all duplicate Glide-generated classes from react-native-blasted-image
            def nodeModulesPath = file("${rootProject.projectDir}/../node_modules")
            def blastedImageBuildPath = new File(nodeModulesPath, "react-native-blasted-image/android/build")
            if (blastedImageBuildPath.exists()) {
                // Remove all Glide-generated classes (GeneratedAppGlideModuleImpl, GeneratedRequestManagerFactory, etc.)
                fileTree(dir: blastedImageBuildPath, include: '**/com/bumptech/glide/Generated*.dex').each { file ->
                    try {
                        delete file
                        println "✓ Removed duplicate Glide class: ${file.name}"
                    } catch (Exception e) {
                        println "⚠ Could not remove ${file.path}: ${e.message}"
                    }
                }
            }
        }
    }
    
    // Remove duplicates from JAR files before R8 minification
    tasks.matching { it.name == 'minifyReleaseWithR8' || it.name == 'minifyDebugWithR8' }.configureEach { task ->
        task.doFirst {
            def nodeModulesPath = file("${rootProject.projectDir}/../node_modules")
            def blastedImageBuildPath = new File(nodeModulesPath, "react-native-blasted-image/android/build")
            if (blastedImageBuildPath.exists()) {
                // Find and remove duplicate Glide classes from JAR files
                def releaseJar = new File(blastedImageBuildPath, "intermediates/runtime_library_classes_jar/release/bundleLibRuntimeToJarRelease/classes.jar")
                def debugJar = new File(blastedImageBuildPath, "intermediates/runtime_library_classes_jar/debug/bundleLibRuntimeToJarDebug/classes.jar")
                
                [releaseJar, debugJar].each { jarFile ->
                    if (jarFile.exists()) {
                        try {
                            def tempDir = new File(jarFile.parentFile, "temp_${System.currentTimeMillis()}")
                            tempDir.mkdirs()
                            // Extract JAR
                            project.copy {
                                from project.zipTree(jarFile)
                                into tempDir
                                exclude 'com/bumptech/glide/GeneratedAppGlideModuleImpl.class'
                                exclude 'com/bumptech/glide/GeneratedRequestManagerFactory.class'
                            }
                            // Recreate JAR without duplicates
                            jarFile.delete()
                            project.ant.zip(destfile: jarFile, basedir: tempDir, includes: '**/*')
                            // Clean up
                            delete tempDir
                            println "✓ Removed duplicate Glide classes from JAR: ${jarFile.name}"
                        } catch (Exception e) {
                            println "⚠ Could not process JAR ${jarFile.path}: ${e.message}"
                        }
                    }
                }
            }
        }
    }
}
